name: Mobile Release Builds (Android & iOS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-build:
    name: Android APK & AAB Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets & server bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Debug APK & Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: branham-hills-pool-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Android Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: branham-hills-pool-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

  ios-build:
    name: iOS Xcode Archive Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets & server bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build iOS simulator target (unsigned verification)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
