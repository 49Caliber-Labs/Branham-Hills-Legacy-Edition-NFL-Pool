name: Mobile Release Builds (Android & iOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build:
    name: Android APK & AAB Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets & server bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode optional Android release keystore
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"

      - name: Build Debug APK & Release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/*.apk release-assets/branham-hills-nfl-pool-debug.apk
          cp android/app/build/outputs/bundle/release/*.aab release-assets/branham-hills-nfl-pool-release.aab
          ls -lh release-assets

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: branham-hills-pool-android-debug-apk
          path: release-assets/branham-hills-nfl-pool-debug.apk

      - name: Upload Android Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: branham-hills-pool-android-release-aab
          path: release-assets/branham-hills-nfl-pool-release.aab

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/branham-hills-nfl-pool-debug.apk
            release-assets/branham-hills-nfl-pool-release.aab
          generate_release_notes: true

  ios-build:
    name: iOS Xcode Archive Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets & server bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build iOS simulator target (unsigned verification)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
