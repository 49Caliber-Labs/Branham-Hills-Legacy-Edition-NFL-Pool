<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="turfGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="55%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="60%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <!-- Background Shield Field -->
  <rect width="512" height="512" rx="96" fill="url(#turfGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="82" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />

  <!-- Subtle Yard Lines -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.12">
    <line x1="72" y1="128" x2="440" y2="128" />
    <line x1="72" y1="256" x2="440" y2="256" />
    <line x1="72" y1="384" x2="440" y2="384" />
  </g>

  <!-- Championship Ring Accent -->
  <circle cx="256" cy="222" r="138" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-dasharray="14 8" opacity="0.65" />

  <!-- Tilted Football -->
  <g transform="translate(256 222) rotate(-28)">
    <ellipse cx="0" cy="0" rx="124" ry="74" fill="url(#leatherGrad)" stroke="#fef3c7" stroke-width="4" />
    <!-- Stripes -->
    <path d="M -78 -56 Q -72 0 -78 56" fill="none" stroke="#fef3c7" stroke-width="10" stroke-linecap="round" />
    <path d="M 78 -56 Q 72 0 78 56" fill="none" stroke="#fef3c7" stroke-width="10" stroke-linecap="round" />
    <!-- Laces -->
    <line x1="-44" y1="0" x2="44" y2="0" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    <line x1="-30" y1="-15" x2="-30" y2="15" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="-10" y1="-16" x2="-10" y2="16" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="10" y1="-16" x2="10" y2="16" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="30" y1="-15" x2="30" y2="15" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Heritage Ribbon -->
  <rect x="66" y="366" width="380" height="72" rx="16" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4" />
  <text x="256" y="399" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" letter-spacing="2" fill="#fde68a">BRANHAM HILLS</text>
  <text x="256" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#ffffff">NFL POOL &bull; EST. 1986</text>
</svg>
